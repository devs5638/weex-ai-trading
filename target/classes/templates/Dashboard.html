<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weex AI Trading Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weex AI Trading Bot</h1>
            <div id="status" class="status">交易状态: 未启动</div>
        </header>

        <main>
            <section class="config-section">
                <h2>配置管理</h2>
                <form id="config-form">
                    <div class="form-group">
                        <label for="apiKey">API Key:</label>
                        <input type="text" id="apiKey" name="apiKey" placeholder="输入Weex API Key">
                    </div>
                    <div class="form-group">
                        <label for="apiSecret">API Secret:</label>
                        <input type="password" id="apiSecret" name="apiSecret" placeholder="输入Weex API Secret">
                    </div>
                    <div class="form-group">
                        <label for="symbol">交易对:</label>
                        <input type="text" id="symbol" name="symbol" value="BTCUSDT">
                    </div>
                    <div class="form-group">
                        <label for="amount">交易金额:</label>
                        <input type="number" id="amount" name="amount" value="100" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="interval">交易间隔(ms):</label>
                        <input type="number" id="interval" name="interval" value="60000">
                    </div>
                    <button type="submit">保存配置</button>
                </form>
            </section>

            <section class="trading-section">
                <h2>交易控制</h2>
                <div class="control-buttons">
                    <button id="start-btn" class="btn-primary">启动交易</button>
                    <button id="stop-btn" class="btn-secondary">停止交易</button>
                </div>
            </section>

            <section class="data-section">
                <h2>实时数据</h2>
                <div class="data-grid">
                    <div class="data-item">
                        <h3>账户余额</h3>
                        <div id="balance">加载中...</div>
                    </div>
                    <div class="data-item">
                        <h3>当前价格</h3>
                        <div id="price">加载中...</div>
                    </div>
                    <div class="data-item">
                        <h3>持仓量</h3>
                        <div id="position">加载中...</div>
                    </div>
                    <div class="data-item">
                        <h3>总收益</h3>
                        <div id="profit">加载中...</div>
                    </div>
                </div>
            </section>

            <section class="history-section">
                <h2>交易历史</h2>
                <div id="history-list">加载中...</div>
            </section>
        </main>
    </div>

    <script src="/js/style.js"></script>
</body>
</html>
