<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weex AI Trading Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weex AI Trading Bot</h1>
            <div id="status" class="status">交易状态: 未启动</div>
        </header>

        <main>
            <section class="data-section">
                <h2>实时数据</h2>
                <div class="data-grid">
                    <div class="data-item">
                        <h3>账户余额</h3>
                        <div id="balance">加载中...</div>
                    </div>
                </div>
            </section>

            <section class="trading-section">
                <h2>交易控制</h2>
                <div class="control-buttons">
                    <button id="start-btn" class="btn-primary">启动交易</button>
                    <button id="stop-btn" class="btn-secondary">停止交易</button>
                </div>
            </section>

            <section class="history-section">
                <h2>交易历史</h2>
                <div id="history-list">加载中...</div>
            </section>
        </main>
    </div>

    <script src="/js/style.js"></script>
</body>
</html>
