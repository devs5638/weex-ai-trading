<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weex AI Trading Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weex AI Trading Bot</h1>
            <div id="status" class="status">交易状态: 未启动</div>
        </header>

        <main>
            <section class="data-section">
                <h2>实时数据</h2>
                <div class="data-grid">
                    <div class="data-item">
                        <h3>账户总权益</h3>
                        <div id="total-equity">加载中...</div>
                    </div>
                    <div class="data-item">
                        <h3>账户余额</h3>
                        <div id="balance">加载中...</div>
                    </div>
                </div>
            </section>

            <section class="trading-section">
                <h2>交易控制</h2>
                <div class="control-buttons">
                    <button id="start-btn" class="btn-primary">启动交易</button>
                    <button id="stop-btn" class="btn-secondary">停止交易</button>
                    <button id="close-position-btn" class="btn-secondary">一键平仓</button>
                </div>
            </section>

            <section class="position-section">
                <h2>当前持仓</h2>
                <div id="position-info">
                    <table class="position-table">
                        <thead>
                            <tr>
                                <th>保证金</th>
                                <th>持仓方向</th>
                                <th>持仓数量</th>
                                <th>开仓均价</th>
                                <th>未实现盈亏</th>
                                <th>强平价格</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td id="position-margin-size">加载中...</td>
                                <td id="position-side">加载中...</td>
                                <td id="position-size">加载中...</td>
                                <td id="position-open-value">加载中...</td>
                                <td id="position-unrealize-pnl">加载中...</td>
                                <td id="position-liquidate-price">加载中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/style.js"></script>
</body>
</html>
